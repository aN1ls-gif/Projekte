apiVersion: v1
kind: Service
metadata:
  name: streamlit-dashboard-service
  labels:
    app: pyspark-project
    generell_purpose: service
    specific_purpose: dashboard-service
    frontback: frontend
spec:
  selector:
    app: pyspark-project
    generell_purpose: app
    specific_purpose: dashboard
    frontback: frontend
  type: NodePort
  ports:
    - name: dashboard-service-port
      protocol: TCP
      port: 90 # The port exposed to the other cluster components; should not be the same as the targetPort/ containerPort
      targetPort: board-port # The port exposed that the component listens to. Can be just the port number or the custom-name of the port if one has been assigned
      nodePort: 31000 # which port is exposed to everything outside of the cluster